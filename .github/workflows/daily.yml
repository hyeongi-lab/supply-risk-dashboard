# 매일 아침 자동 실행: 수집(collect.py) → 판단·알림(analyze.py) → data/ 결과를 저장소에 저장
#
# - 매일 07:00 한국 시간 (= 22:00 UTC 전날). GitHub 사정으로 몇 분~수십 분 늦게 시작할 수 있음
# - Actions 탭 → "매일 수집·판단" → "Run workflow" 버튼으로 언제든 수동 실행 가능
# - Claude API 키(ANTHROPIC_API_KEY)가 Secrets에 없으면: 규칙 판단 + 가장 최근 수동 판단 파일(data/judgments/) 적용
#   Secrets에 키를 넣으면 다음 실행부터 자동으로 Claude API 판단으로 바뀜
# - 메일: MAIL_SIMULATE Secret이 없으면 '모의 발송'(1)으로 동작
# - 수집 일부가 실패해도 결과는 먼저 저장하고, 마지막에 실행을 '실패'로 표시 → GitHub이 가입 메일로 실패 알림

name: 매일 수집·판단

on:
  schedule:
    - cron: "0 22 * * *"   # 07:00 KST
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write           # data/ 결과를 저장소에 커밋하기 위해

concurrency:
  group: daily-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 코드 내려받기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 수집 (뉴스·가격·공고)
        run: python collect.py

      - name: 위험 판단·알림
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          ALERT_TO_TEAM: ${{ secrets.ALERT_TO_TEAM }}
          MAIL_SIMULATE: ${{ secrets.MAIL_SIMULATE || '1' }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL || 'https://supply-risk-hyeongi.streamlit.app/' }}
        run: python analyze.py

      - name: 결과 저장 (data/ 커밋)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "바뀐 데이터 없음"
          else
            git commit -m "자동 수집·판단 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
            git pull --rebase
            git push
          fi

      - name: 수집 실패 확인 (실패가 있으면 알림이 가도록 실행을 '실패'로 표시)
        run: |
          python - <<'EOF'
          import json, sys
          s = json.load(open("data/last_run.json", encoding="utf-8"))
          if not s.get("ok"):
              print("수집 일부 실패:", ", ".join(s.get("failed_parts", [])))
              for line in s.get("problems", []):
                  print(" -", line)
              sys.exit(1)
          print("모든 수집 정상")
          EOF
